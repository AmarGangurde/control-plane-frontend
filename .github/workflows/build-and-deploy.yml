name: Build, Push to GHCR and Deploy to EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=latest
          
          docker build . \
            --file Dockerfile \
            --tag $IMAGE_ID:$VERSION \
            --build-arg VITE_API_BASE=${{ secrets.VITE_API_BASE }} \
            --build-arg VITE_PHONEPE_CALLBACK=${{ secrets.VITE_PHONEPE_CALLBACK }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          
          docker push $IMAGE_ID:$VERSION

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script: |
            set -e
            IMAGE_ID=ghcr.io/${{ github.repository }}
            IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
            VERSION=latest
            
            echo "Logging into GHCR and pulling $IMAGE_ID:$VERSION"
            # Ensure actor is lowercased for login (sometimes helps with 403)
            ACTOR=$(echo "${{ github.actor }}" | tr '[A-Z]' '[a-z]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ACTOR --password-stdin
            
            # Deploy using Docker Compose
            cd ~/control-plane-frontend
            git pull origin main || true
            
            echo "🐳 Pulling latest images from GHCR..."
            docker compose pull
            
            echo "🚀 Starting updated containers..."
            docker compose up -d
            
            echo "🏁 Deployment successful!"

