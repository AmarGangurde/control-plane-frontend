name: Build Frontend and Push to GHCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel duplicate runs — only keep the latest for each branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and SHA tags
        id: meta
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          VERSION=v$(jq -r .version package.json)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_id }}:latest
            ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_id }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image_id }}:buildcache,mode=max
          provenance: false
