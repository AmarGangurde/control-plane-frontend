name: Build Frontend and Push to GHCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and SHA
        id: meta
        run: |
          VERSION=v$(jq -r .version package.json)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha_tag=${VERSION}-${SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          VERSION=${{ steps.meta.outputs.version }}
          SHA_TAG=${{ steps.meta.outputs.sha_tag }}

          echo "Pushing tags: $VERSION, $SHA_TAG, latest"
          
          docker build . --file Dockerfile \
            --tag $IMAGE_ID:$VERSION \
            --tag $IMAGE_ID:$SHA_TAG \
            --tag $IMAGE_ID:latest
          
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$SHA_TAG
          docker push $IMAGE_ID:latest

