name: Build, Push to GHCR and Deploy to EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=latest
          
          docker build . \
            --file Dockerfile \
            --tag $IMAGE_ID:$VERSION \
            --build-arg VITE_API_BASE=${{ secrets.VITE_API_BASE }} \
            --build-arg VITE_PHONEPE_CALLBACK=${{ secrets.VITE_PHONEPE_CALLBACK }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          
          docker push $IMAGE_ID:$VERSION

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script: |
            set -e
            IMAGE_ID=ghcr.io/${{ github.repository }}-frontend
            IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
            VERSION=latest
            
            echo "Logging into GHCR and pulling $IMAGE_ID:$VERSION"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGE_ID:$VERSION

            # Blue-Green Deploy Logic
            APP_NAME="frontend-app"
            NEW_PORT=8081
            OLD_PORT=80
            
            echo "🚀 Starting Blue-Green Swap..."
            
            # Start "Green" version
            docker run -d \
              --name "${APP_NAME}-green" \
              -p $NEW_PORT:80 \
              $IMAGE_ID:$VERSION

            echo "⏳ Verifying new container..."
            sleep 5
            
            # Simple check if container is running
            if [ "$(docker inspect -f '{{.State.Running}}' ${APP_NAME}-green)" = "true" ]; then
                echo "✅ New container is healthy. Flipping traffic..."
                
                # Update Nginx on host (assuming user has set up the sed command or similar)
                # sudo sed -i "s/127.0.0.1:$OLD_PORT/127.0.0.1:$NEW_PORT/g" /etc/nginx/sites-available/default
                # sudo nginx -s reload
                
                # For this demo, we swap containers
                docker stop $APP_NAME || true
                docker rm $APP_NAME || true
                docker rename "${APP_NAME}-green" $APP_NAME
                
                # Re-run on primary port for long-term consistency
                docker stop $APP_NAME
                docker rm $APP_NAME
                docker run -d --restart unless-stopped --name $APP_NAME -p $OLD_PORT:80 $IMAGE_ID:$VERSION
                
                echo "🏁 Deployment successful!"
            else
                echo "❌ New container failed to start. Rolling back..."
                docker stop "${APP_NAME}-green" || true
                docker rm "${APP_NAME}-green" || true
                exit 1
            fi

